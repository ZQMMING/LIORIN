name: M3 isolated configuration preflight
on:
  pull_request:
    branches: [codex/m2-integration]
  push:
    branches: [codex/m3-isolated-preflight]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest pytest-subtests httpx
      - run: python -m pytest tests/test_m3_isolation_preflight.py -q -p no:cacheprovider
