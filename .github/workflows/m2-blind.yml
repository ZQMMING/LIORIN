name: M2 blind degradation

on:
  pull_request:
    branches: [codex/m2-location-pr]
  push:
    branches: [codex/m2-blind-status]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blind-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest pytest-subtests httpx
      - name: Check blind engine and degradation status
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_m2_blind_failure_reproduction.py tests/test_blind*.py -q -p no:cacheprovider
