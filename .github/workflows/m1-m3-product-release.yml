name: M1-M3 full product release gate
on:
  workflow_dispatch:
  push:
    branches: ['product-release/**']
permissions:
  contents: read
jobs:
  integration-prerequisites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require product backend and frozen replay before release
        shell: bash
        run: |
          for path in src/tongshu/api/app.py src/tongshu/pipeline.py scripts/golden_replay.py cases/baselines/golden_replay_baseline.json; do
            if [ ! -f "$path" ]; then
              echo "Release blocked: required product component missing: $path"
              exit 1
            fi
          done
      - name: Run frozen Golden replay (never update the baseline)
        run: python scripts/golden_replay.py --check
        env:
          PYTHONPATH: src
