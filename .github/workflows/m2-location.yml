name: M2 location ambiguity

on:
  pull_request:
    branches: [codex/m2-context-pr]
  push:
    branches: [codex/m2-location-pr]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  location-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest pytest-subtests httpx
      - name: Verify city ambiguity and time context
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest tests/test_m2_location_ambiguity.py
          tests/test_m2_context_propagation.py tests/test_b02_late_zi_golden.py
          tests/test_algorithm_verification.py -q -p no:cacheprovider
