name: M1 frontend checks

on:
  pull_request:
    branches: [codex/m1-product-baseline]
    paths:
      - 'frontend-case/**'
      - '.github/workflows/m1-frontend.yml'
  push:
    branches: [codex/m1-product-baseline, codex/m1-frontend-fix]
    paths:
      - 'frontend-case/**'
      - '.github/workflows/m1-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-case
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-case/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
