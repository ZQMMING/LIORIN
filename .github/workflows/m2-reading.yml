name: M2 reading API
on:
  pull_request:
    branches: [codex/m2-blind-status]
  push:
    branches: [codex/m2-reading-api]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest pytest-subtests httpx
      - name: Reading, blind and time regressions
        run: python -m pytest tests/test_m2_reading_api.py tests/test_m2_blind_failure_reproduction.py tests/test_m2_context_propagation.py -q -p no:cacheprovider
        env:
          PYTHONPATH: src
          TONGSHU_ENV_FILE: /nonexistent/liorin-test.env
