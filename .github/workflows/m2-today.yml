name: M2 TODAY date provenance
on:
  pull_request:
    branches: [codex/m2-blind-status]
  push:
    branches: [codex/m2-today-context]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  date-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest pytest-subtests httpx
      - run: python -m pytest tests/test_m2_today_date_context.py tests/test_m2_context_propagation.py -q -p no:cacheprovider
        env:
          PYTHONPATH: src
