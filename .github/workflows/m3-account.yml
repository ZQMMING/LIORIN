name: M3 account integration
on:
  pull_request:
    branches: [codex/m3-isolated-preflight]
  push:
    branches: [codex/m3-account-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest pytest-subtests httpx cryptography
      - name: Auth, cookie and TLS sink tests
        run: python -m pytest tests/test_m3_browser_session.py tests/test_m3_session_boundaries.py tests/test_m3_smtp_capture.py tests/test_email_auth_api.py tests/test_email_auth_delivery.py tests/test_email_auth_store_unit.py tests/test_profile_store_unit.py tests/test_profile_stored_contract.py tests/test_run_server_auth_wiring.py tests/auth/test_identity_gateway_v2.py --deselect tests/test_profile_stored_contract.py::ProfileStoredContractTests::test_authenticated_save_then_read_from_store -q -p no:cacheprovider
        env:
          PYTHONPATH: src
          TONGSHU_ENV_FILE: /nonexistent/liorin-test.env
      - name: Expose pre-existing city-name versus canonical-ID contract conflict
        continue-on-error: true
        run: python -m pytest tests/test_profile_stored_contract.py::ProfileStoredContractTests::test_authenticated_save_then_read_from_store -q -p no:cacheprovider
        env:
          PYTHONPATH: src
          TONGSHU_ENV_FILE: /nonexistent/liorin-test.env
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-case
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-case/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test -- --run
      - run: npm run build
