name: M1-M3 release candidate checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [integration/m1-m3-release-candidate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-case
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-case/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test -- --run
      - run: npm run build
  integration-prerequisites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require product backend and frozen replay before release
        shell: bash
        run: |
          for path in src/tongshu/api/app.py src/tongshu/pipeline.py scripts/golden_replay.py cases/baselines/golden_replay_baseline.json; do
            if [ ! -f "$path" ]; then
              echo "Release blocked: required product component missing: $path"
              exit 1
            fi
          done
      - name: Run frozen Golden replay (never update the baseline)
        run: python scripts/golden_replay.py --check
        env:
          PYTHONPATH: src
