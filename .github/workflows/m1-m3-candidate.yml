name: M1 frontend integration checks
on:
  pull_request:
    branches: [main, codex/product-b-today, codex/product-b-daily-explorer, codex/product-b-explorer-calendar]
  push:
    branches: [integration/m1-m3-release-candidate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-case
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-case/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test -- --run
      - run: npm run build
      - if: github.base_ref != '' && github.base_ref != 'main'
        run: npm run build
        env:
          VITE_LIORIN_PRODUCT_B_PREVIEW: '1'
