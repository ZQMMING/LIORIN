name: Account adapter safety checks
on:
  pull_request:
    paths:
      - 'services/liorin_api/**'
      - '.github/workflows/account-port.yml'
  push:
    branches: [codex/account-main-port]
permissions:
  contents: read
jobs:
  adapter-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/liorin_api/requirements.txt httpx pytest pytest-timeout ruff
      - run: python -m pip install -e .
      - run: python -m pytest services/liorin_api/tests -q -p no:cacheprovider
      - run: python -m ruff check services/liorin_api/account services/liorin_api/app.py services/liorin_api/tests/test_account_gate.py services/liorin_api/account_tests
