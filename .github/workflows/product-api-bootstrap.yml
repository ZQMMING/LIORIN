name: Product API bootstrap
on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/product-api-bootstrap]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/liorin_api/requirements.txt httpx==0.28.1 pytest==9.1.1 pytest-timeout==2.4.0
      - run: python -m pip install -e .
      - run: python -m pytest services/liorin_api/tests tests/heluo/test_h10b_jie_interval.py tests/heluo/test_heluo_lazy_liuri.py -q -p no:cacheprovider
