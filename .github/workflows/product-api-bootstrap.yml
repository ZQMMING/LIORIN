name: Product API bootstrap
on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/product-api-bootstrap]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/liorin_api/requirements.txt httpx==0.28.1 pytest==9.1.1 pytest-timeout==2.4.0
      - run: python -m pytest tests/product_api/test_bootstrap.py -q -p no:cacheprovider
