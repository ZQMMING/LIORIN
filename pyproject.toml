[project]
name = "heluo-engine"
version = "1.0.0"
description = "河洛真数推命引擎：基于《河洛真数》的卦象/化工/元气/大运流年/断语引擎"
requires-python = ">=3.11"
dependencies = [
    "sxtwl>=1.0.0",
    "lunar_python>=1.4.8",
    "chinese-calendar>=1.10.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
