[project]
name = "tongshu"
version = "1.0.0"
description = "TONGSHU reasoning pipeline v1.0"
requires-python = ">=3.11"
dependencies = [
    "sxtwl>=1.0.0",
    "lunar_python>=1.4.8",
    "chinese-calendar>=1.10.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "fastapi>=0.100",
    "pydantic>=2.0",
    "psycopg2-binary>=2.9.0",
    "openai>=1.0.0",
    # B-09 STAGE-A: required for TimestampSigner-signed access tokens
    # in tongshu.services.identity_gateway.
    "itsdangerous>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]